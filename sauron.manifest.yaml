# ──────────────────────────────────────────────
# SEED JOB SCHEDULE
# All jobs run on Railway cron; write to Redis + postgres
# ──────────────────────────────────────────────
seed_schedule:
  every_30s:
    - seed-flight-tracker.mjs       # ADS-B Exchange aircraft states
    - seed-maritime-tracker.mjs     # VesselFinder AIS positions (rate-limited to 5min effective)

  every_5min:
    - seed-social-pulse.mjs         # Reddit JSON, Nitter RSS, Telegram /s/
    - seed-market-monitor.mjs       # Yahoo Finance tickers
    - seed-crypto-monitor.mjs       # CoinGecko prices + volumes
    - seed-conflict-live.mjs        # LiveUAMap RSS

  every_15min:
    - seed-geopolitical-events.mjs  # GDELT v2 doc API (15min granularity)
    - seed-prediction-markets.mjs   # Polymarket + Metaculus

  every_30min:
    - seed-threat-intel.mjs         # URLhaus, MalwareBazaar, Feodo, OTX
    - seed-network-exposure.mjs     # GreyNoise community, AbuseIPDB blocklist
    - seed-cve-monitor.mjs          # NVD CVE feed (new CVSS>=7)
    - seed-ransomware-tracker.mjs   # RansomWatch JSON
    - seed-disaster-monitor.mjs     # GDACS + ReliefWeb disasters
    - seed-telegram-monitor.mjs     # Public Telegram channels

  every_hour:
    - seed-weather.mjs              # OpenWeatherMap
    - seed-conflict-events.mjs      # ACLED API
    - seed-breach-tracker.mjs       # HIBP breach list delta
    - seed-pathogen-tracker.mjs     # WHO RSS + ProMED
    - seed-space-weather.mjs        # NOAA SWPC solar events
    - seed-satellite-tracker.mjs    # N2YO TLE updates
    - seed-news-aggregator.mjs      # NewsAPI + GDELT GKG

  every_6h:
    - seed-health-alerts.mjs        # WHO disease outbreak news
    - seed-crypto-intel.mjs         # Blockchair on-chain metrics

  daily:
    - seed-economic-indicators.mjs  # FRED, World Bank, IMF
    - seed-sanctions-monitor.mjs    # OFAC + UN + EU + OpenSanctions
    - seed-sec-monitor.mjs          # SEC EDGAR 8-K filings
    - seed-gov-spending.mjs         # USASpending.gov contracts
    - seed-satellite-overlay.mjs    # NASA GIBS daily imagery
    - seed-forecasts.mjs            # Full forecast pipeline

  weekly:
    - seed-geo-enrichment.mjs       # GeoNames + Natural Earth refresh

  monthly:
    - seed-arms-trade.mjs           # SIPRI arms transfer data
    - seed-nuclear-monitor.mjs      # IAEA + FAS nuclear data

  annual:
    - seed-terrorism-db.mjs         # GTD import
    - seed-military-balance.mjs     # IISS + SIPRI military balance

# ──────────────────────────────────────────────
# MIGRATION STEPS (dependency reduction)
# Execute in this order to reach minimal platform
# ──────────────────────────────────────────────
migration:
  step_1_redis:
    description: "Replace Upstash with Railway Redis"
    effort: 2_days
    files:
      - server/_shared/redis.ts         # swap HTTP client for ioredis
      - scripts/seed-*.mjs              # update REDIS_URL var
      - server/_shared/premium-check.ts # no change needed
    env_changes:
      remove: [UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN]
      add:    [REDIS_URL]  # redis://default:pass@railway-host:6379

  step_2_storage:
    description: "Replace Cloudflare R2 with Railway postgres JSONB or local volume"
    effort: 3_days
    files:
      - server/_shared/r2.ts            # replace with postgres upsert or fs.writeFile
      - scripts/seed-*.mjs              # update storage calls
    env_changes:
      remove: [R2_BUCKET, R2_ACCOUNT_ID, R2_ACCESS_KEY, R2_SECRET_KEY]
      add:    [DATABASE_URL]  # postgres://...

  step_3_llm:
    description: "Drop OpenRouter; route all LLM calls through Groq only"
    effort: 1_day
    files:
      - server/_shared/llm.ts           # remove openrouter branch
      - scripts/seed-forecasts.mjs      # remove OPENROUTER env references
    env_changes:
      remove: [FORECAST_LLM_MODEL_OPENROUTER, FORECAST_LLM_*_OPENROUTER]
      keep:   [GROQ_API_KEY, ANTHROPIC_API_KEY]

  step_4_convex:
    description: "Replace Convex reactive DB with postgres"
    effort: 5_days
    files:
      - convex/                          # export schema; migrate to postgres
      - src/lib/convex*.ts              # replace with REST API calls to own backend
    env_changes:
      remove: [CONVEX_URL, CONVEX_DEPLOY_KEY]
      add:    [DATABASE_URL]

  step_5_payments:
    description: "Replace Dodo Payments; initially gate isPremium via env flag"
    effort: 1_day
    files:
      - server/_shared/premium-check.ts # add FORCE_PREMIUM_USERIDS env override
    notes: >
      Set FORCE_PREMIUM_USERIDS=* to make everyone premium during beta.
      Implement Stripe later when billing is needed.
    env_changes:
      remove: [DODO_PAYMENTS_*]
      add:    [FORCE_PREMIUM_USERIDS]   # optional; comma-separated or "*"

  step_6_platform:
    description: "Move from Vercel to Railway (single platform)"
    effort: 3_days
    files:
      - Dockerfile.app                   # new: Express server wrapping edge handlers
      - railway.toml                     # add [app] service
      - vercel.json                      # deprecate (keep for fallback)
    notes: >
      Already have docker/build-handlers.mjs compiling edge functions to CJS.
      Wrap with Express router matching vercel.json routes.

# ──────────────────────────────────────────────
# ARCHITECTURE SUMMARY (post-migration)
# ──────────────────────────────────────────────
architecture_target:
  services:
    - name: app
      runtime: node:22
      role: "Frontend SPA static files + API handler (Express)"
      port: 3000
    - name: worker
      runtime: node:22
      role: "Cron seed jobs (all seed-*.mjs)"
      schedule: "via Railway cron"
    - name: redis
      runtime: redis:7
      role: "Cache + task queue + bootstrap data"
    - name: postgres
      runtime: postgres:16
      role: "User records, settings, billing state, large seed artifacts"

  data_flow: >
    seed workers → Redis (hot cache, TTL-keyed) → API handlers → SPA frontend
    seed workers → postgres (cold storage, seed artifacts)
    user requests → Clerk JWT verify → API handler → Redis hit or upstream fetch

  cache_strategy:
    l1: "module-scope Map (in-process, warm invocations only)"
    l2: "Redis (cross-request, TTL per data type)"
    l3: "postgres JSONB (large artifacts, infrequent reads)"
    l4: "upstream API (fallback, rate-limited)"

  llm_routing:
    primary: groq          # llama-3.1-70b-versatile, 6000 TPM free
    fallback: anthropic    # claude-haiku-4-5 for overflow
    reasoning: groq        # deepseek-r1 or qwen for reasoning tasks
    simulation: groq       # separate env var: FORECAST_LLM_SIMULATION_MODEL_GROQ
