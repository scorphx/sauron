# sauron.manifest.yaml
# Master configuration manifest for the World Monitor (Sauron) repository.
# Covers platform targets, dependency inventory, data source registry,
# feature roadmap, and OSINT integration plan.
# Last updated: 2026-04-06

meta:
  project: sauron
  codename: "World Monitor"
  description: >
    Real-time global intelligence dashboard. Aggregates geopolitical signals,
    economic data, conflict tracking, threat intel, OSINT feeds, and predictive
    analytics into a single authenticated SPA with AI-powered situation deduction.
  branch: claude/build-complete-features-9oBnc
  stack:
    frontend: Vite + TypeScript SPA
    backend: Vercel Edge Functions (31 domain handlers)
    rpc: Protocol Buffers (sebuf framework)
    workers: Railway background jobs (cron seed scripts)
    cache: Upstash Redis (HTTP REST)
    storage: Cloudflare R2
    auth: Clerk JWT
    db: Convex
    payments: Dodo Payments

# ──────────────────────────────────────────────
# PLATFORM CONSOLIDATION
# Goal: one deploy target, zero external-API deps, self-hosted everything
# ──────────────────────────────────────────────
platform:
  current:
    - vercel          # edge functions + frontend CDN
    - railway         # background workers + Redis
    - upstash         # managed Redis (HTTP REST)
    - cloudflare_r2   # object storage (seed artifacts)
    - clerk           # auth (JWT + JWKS)
    - convex          # reactive DB (user records, settings)
    - dodo_payments   # subscription billing
    - openrouter      # LLM routing
    - groq            # fast LLM inference

  target_minimal:
    host: railway                 # single platform
    services:
      app:
        image: node:22-alpine
        role: frontend + API server (Express/Hono)
        replaces: [vercel]
      worker:
        image: node:22-alpine
        role: cron seed jobs (existing scripts)
        replaces: [railway_workers]
      redis:
        image: redis:7-alpine
        role: cache + task queue
        replaces: [upstash]
      postgres:
        image: postgres:16-alpine
        role: user records, settings, billing state
        replaces: [convex, dodo_payments_DB]

  dependency_actions:
    remove:
      - upstash:        { replace_with: "railway Redis", effort: medium, notes: "swap ioredis for @upstash/redis client; remove HTTP REST calls" }
      - convex:         { replace_with: "postgres (Railway)", effort: high, notes: "migrate user/settings schema; remove convex client from frontend" }
      - dodo_payments:  { replace_with: "Stripe or hardcode isPremium=true initially", effort: low, notes: "isPremium gating can default to true until billing rebuilt" }
      - openrouter:     { replace_with: "groq only", effort: low, notes: "single provider, remove FORECAST_LLM_*_OPENROUTER env vars" }
      - cloudflare_r2:  { replace_with: "local Railway volume or postgres JSONB", effort: medium, notes: "seed artifacts are read-heavy; postgres works for <100MB" }

    keep:
      - clerk:    { reason: "JWT JWKS verification is stateless; no round-trips needed; free tier sufficient" }
      - groq:     { reason: "fastest free inference tier; fallback to Anthropic/OpenAI via env var" }

    simplify:
      - vercel → railway: >
          Compile edge handlers to CJS (already done via docker/build-handlers.mjs),
          serve with Express. Remove vercel.json routing; add Dockerfile.app.
      - upstash → ioredis: >
          Replace `cachedFetchJson` HTTP client with ioredis pipeline.
          All Redis key names stay the same. Estimated: 2 files changed.

  env_vars_required:
    auth:       [CLERK_JWT_ISSUER_DOMAIN, CLERK_SECRET_KEY, CLERK_PUBLISHABLE_KEY]
    llm:        [GROQ_API_KEY, ANTHROPIC_API_KEY]
    cache:      [REDIS_URL]
    storage:    [R2_BUCKET, R2_ACCOUNT_ID, R2_ACCESS_KEY, R2_SECRET_KEY]  # drop after R2→postgres
    seed:       [FORECAST_LLM_PROVIDER_ORDER, FORECAST_LLM_MODEL_GROQ]


